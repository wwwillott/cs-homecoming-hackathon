services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: network
      POSTGRES_USER: network
      POSTGRES_PASSWORD: network
    ports:
      - "5432:5432"
    volumes:
      - network_postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U network -d network"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  network_postgres:
