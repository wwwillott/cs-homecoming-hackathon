name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        env:
          # Prefer custom domain when DNS is live; onrender works immediately.
          ORBIT_API_URL: ${{ vars.ORBIT_API_URL || 'https://spruce-api-hfqi.onrender.com' }}
        run: |
          flutter build web --release --base-href=/ \
            --pwa-strategy=none \
            --build-number="${{ github.run_number }}" \
            --build-name="1.0.${{ github.run_number }}" \
            --dart-define=ORBIT_API_URL="$ORBIT_API_URL"

      - name: Add custom domain CNAME
        run: echo 'spruce.my' > build/web/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
