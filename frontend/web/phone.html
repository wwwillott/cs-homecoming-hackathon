<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spruce · Phone preview</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at 50% 0%, #173f24 0%, #0c1910 45%, #080c09 100%);
      color: #f6fde7;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    .bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      padding: 12px 16px 8px;
    }
    .bar select, .bar button {
      font: inherit;
      font-size: 13px;
      color: #f6fde7;
      background: rgba(246, 253, 231, 0.08);
      border: 1px solid rgba(246, 253, 231, 0.18);
      border-radius: 10px;
      padding: 7px 12px;
      cursor: pointer;
    }
    .bar button:hover, .bar select:hover { background: rgba(116, 198, 60, 0.18); }
    .bar option { color: #101a13; }
    .size { font-size: 12px; opacity: 0.6; min-width: 70px; text-align: center; }
    .stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding-bottom: 12px;
    }
    .phone {
      position: relative;
      border-radius: 46px;
      padding: 12px;
      background: #111613;
      box-shadow: 0 0 0 2px #2a332c, 0 30px 80px rgba(0, 0, 0, 0.55);
      transform-origin: center center;
      flex-shrink: 0;
    }
    .phone iframe {
      display: block;
      border: 0;
      border-radius: 34px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="bar">
    <select id="device">
      <option value="412x915">Pixel 7a</option>
      <option value="390x844">iPhone 14</option>
      <option value="360x780">Small Android</option>
      <option value="430x932">Large phone</option>
      <option value="820x1180">Tablet</option>
    </select>
    <button id="rotate" title="Rotate">⟳ Rotate</button>
    <button id="reload" title="Reload the app">↻ Reload</button>
    <span class="size" id="size"></span>
  </div>
  <div class="stage" id="stage">
    <div class="phone" id="phone">
      <iframe id="app" src="./" title="Spruce app"></iframe>
    </div>
  </div>

  <script>
    const device = document.getElementById('device');
    const frame = document.getElementById('app');
    const phone = document.getElementById('phone');
    const stage = document.getElementById('stage');
    const sizeLabel = document.getElementById('size');
    let landscape = false;

    device.value = localStorage.getItem('phonePreview.device') || device.value;
    landscape = localStorage.getItem('phonePreview.landscape') === '1';

    function layout() {
      let [w, h] = device.value.split('x').map(Number);
      if (landscape) [w, h] = [h, w];
      frame.style.width = w + 'px';
      frame.style.height = h + 'px';
      sizeLabel.textContent = w + ' × ' + h;
      const pad = 24;
      const scale = Math.min(1, (stage.clientWidth - pad) / (w + pad), (stage.clientHeight - pad) / (h + pad));
      phone.style.transform = 'scale(' + scale + ')';
    }

    device.addEventListener('change', () => {
      localStorage.setItem('phonePreview.device', device.value);
      layout();
    });
    document.getElementById('rotate').addEventListener('click', () => {
      landscape = !landscape;
      localStorage.setItem('phonePreview.landscape', landscape ? '1' : '0');
      layout();
    });
    document.getElementById('reload').addEventListener('click', () => {
      frame.src = './?t=' + Date.now();
    });
    window.addEventListener('resize', layout);
    layout();
  </script>
</body>
</html>
